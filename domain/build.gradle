// Domain module: framework-independent code with only JDK production dependencies.
// Enables java-test-fixtures so other test suites can reuse domain object factories.
plugins {
    id 'transaction.java-conventions'
    id 'java-test-fixtures'
}

dependencies {
    testImplementation platform('org.springframework.boot:spring-boot-dependencies:4.1.1')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // testFixtures are available to all other modules via testFixtures(project(':domain'))
    testFixturesImplementation platform('org.springframework.boot:spring-boot-dependencies:4.1.1')
    testFixturesImplementation 'org.junit.jupiter:junit-jupiter-api'
}
